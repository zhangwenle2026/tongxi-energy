<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通喜果汁·能量进化 — 全系列能量饮商业计划书</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0A0A0F;
    --bg-secondary: #0F0F18;
    --bg-card: #13131F;
    --bg-card-hover: #1A1A2E;
    --accent-orange: #FF6B35;
    --accent-teal: #00D4AA;
    --accent-purple: #8B5CF6;
    --accent-red: #FF4444;
    --text-primary: #F0F0F5;
    --text-secondary: #8888AA;
    --text-muted: #555570;
    --border: #1E1E30;
    --border-light: #2A2A40;
    --gradient-orange: linear-gradient(135deg, #FF6B35, #FF8C00);
    --gradient-teal: linear-gradient(135deg, #00D4AA, #00B894);
    --gradient-purple: linear-gradient(135deg, #8B5CF6, #6D28D9);
    --gradient-red: linear-gradient(135deg, #FF4444, #CC0000);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ===== NAV ===== */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999;
    background: rgba(10, 10, 15, 0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-brand {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--accent-orange);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .nav-links {
    display: flex;
    gap: 0.1rem;
    list-style: none;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-links::-webkit-scrollbar { display: none; }

  .nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 0.3rem 0.55rem;
    border-radius: 6px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .nav-links a:hover {
    color: var(--text-primary);
    background: var(--border);
  }

  /* ===== SECTIONS ===== */
  section {
    padding: 100px 0 80px;
    position: relative;
  }

  section:not(:last-of-type)::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-orange) 30%, var(--accent-teal) 70%, transparent);
    opacity: 0.3;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
  }

  /* ===== HERO ===== */
  #hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 2rem 60px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255, 107, 53, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 60%, rgba(0, 212, 170, 0.05) 0%, transparent 50%),
                var(--bg-primary);
  }

  .hero-inner {
    text-align: center;
    max-width: 900px;
  }

  .hero-tag {
    display: inline-block;
    background: rgba(255, 107, 53, 0.12);
    border: 1px solid rgba(255, 107, 53, 0.3);
    color: var(--accent-orange);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.4rem 1rem;
    border-radius: 100px;
    margin-bottom: 2rem;
  }

  .hero-title {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 1rem;
    letter-spacing: -0.02em;
  }

  .hero-title .highlight-orange { color: var(--accent-orange); }
  .hero-title .highlight-teal { color: var(--accent-teal); }

  .hero-subtitle {
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: var(--text-secondary);
    margin-bottom: 2.5rem;
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  .hero-conclusion {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-left: 3px solid var(--accent-orange);
    border-radius: 12px;
    padding: 1.8rem 2.2rem;
    text-align: left;
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--text-primary);
    margin-bottom: 3rem;
  }

  .hero-conclusion strong { color: var(--accent-orange); }
  .hero-conclusion .teal { color: var(--accent-teal); }

  .hero-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }

  .hero-stat {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem;
    text-align: center;
  }

  .hero-stat-num {
    font-size: 2rem;
    font-weight: 900;
    color: var(--accent-orange);
    display: block;
    line-height: 1;
    margin-bottom: 0.3rem;
  }

  .hero-stat-num.teal { color: var(--accent-teal); }
  .hero-stat-num.purple { color: var(--accent-purple); }

  .hero-stat-label {
    font-size: 0.72rem;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* ===== SECTION HEADER ===== */
  .section-header {
    margin-bottom: 3rem;
  }

  .section-num {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-teal);
    margin-bottom: 0.5rem;
  }

  .section-title {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .section-title .orange { color: var(--accent-orange); }
  .section-title .teal { color: var(--accent-teal); }

  .section-desc {
    color: var(--text-secondary);
    margin-top: 0.8rem;
    font-size: 1rem;
  }

  /* ===== CARDS ===== */
  .cards-grid {
    display: grid;
    gap: 1.5rem;
  }

  .cards-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .cards-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .cards-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.8rem;
    transition: border-color 0.3s, background 0.3s;
  }

  .card:hover {
    border-color: var(--border-light);
    background: var(--bg-card-hover);
  }

  .card-icon {
    font-size: 1.8rem;
    margin-bottom: 1rem;
    display: block;
  }

  .card-num {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent-orange);
    margin-bottom: 0.4rem;
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 0.6rem;
    color: var(--text-primary);
  }

  .card-body {
    font-size: 0.9rem;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .card-body strong { color: var(--text-primary); }

  /* ===== MARKET SECTION ===== */
  .market-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
  }

  .market-big-num {
    font-size: 3.5rem;
    font-weight: 900;
    line-height: 1;
    margin: 0.8rem 0 0.4rem;
  }

  .market-big-num.orange { color: var(--accent-orange); }
  .market-big-num.teal { color: var(--accent-teal); }
  .market-big-num.purple { color: var(--accent-purple); }

  .market-label { font-size: 0.85rem; color: var(--text-secondary); }
  .market-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.8rem; line-height: 1.6; }

  /* ===== TABLE ===== */
  .table-wrap {
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  thead th {
    background: rgba(255, 107, 53, 0.1);
    color: var(--accent-orange);
    padding: 1rem 1.2rem;
    text-align: left;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border-light);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.2s;
  }

  tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
  tbody tr:hover { background: rgba(255, 107, 53, 0.05); }
  tbody tr:last-child { border-bottom: none; }

  td {
    padding: 0.9rem 1.2rem;
    color: var(--text-secondary);
    vertical-align: top;
  }

  td:first-child { color: var(--text-primary); font-weight: 600; }
  td.good { color: var(--accent-teal); font-weight: 600; }
  td.warn { color: var(--accent-orange); font-weight: 600; }
  td.bad { color: var(--accent-red); font-weight: 600; }

  /* ===== PRODUCT SERIES CARDS ===== */
  .series-card {
    border-radius: 16px;
    padding: 1.6rem;
    border: 1px solid transparent;
  }

  .series-card.orange {
    background: rgba(255, 107, 53, 0.06);
    border-color: rgba(255, 107, 53, 0.2);
  }
  .series-card.purple {
    background: rgba(139, 92, 246, 0.06);
    border-color: rgba(139, 92, 246, 0.2);
  }
  .series-card.teal {
    background: rgba(0, 212, 170, 0.06);
    border-color: rgba(0, 212, 170, 0.2);
  }
  .series-card.yellow {
    background: rgba(255, 200, 50, 0.06);
    border-color: rgba(255, 200, 50, 0.2);
  }

  .series-label {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
  }

  .series-name {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 0.4rem;
  }

  .series-name.orange { color: var(--accent-orange); }
  .series-name.purple { color: var(--accent-purple); }
  .series-name.teal { color: var(--accent-teal); }
  .series-name.yellow { color: #FFC832; }

  .series-desc {
    font-size: 0.82rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* ===== PRODUCT LIST ===== */
  .product-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0.8rem;
    margin-top: 1.5rem;
  }

  .product-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    transition: border-color 0.2s;
  }

  .product-item:hover { border-color: var(--border-light); }

  .product-num {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent-orange);
    background: rgba(255,107,53,0.1);
    border-radius: 6px;
    padding: 0.2rem 0.5rem;
    white-space: nowrap;
    margin-top: 0.15rem;
  }

  .product-name { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.2rem; }
  .product-ingredients { font-size: 0.78rem; color: var(--text-secondary); }

  /* ===== DIY PACKS ===== */
  .diy-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.8rem;
    margin-top: 1.5rem;
  }

  .diy-item {
    background: rgba(139, 92, 246, 0.06);
    border: 1px solid rgba(139, 92, 246, 0.2);
    border-radius: 10px;
    padding: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .diy-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
  .diy-dose { font-size: 0.75rem; color: var(--accent-purple); }
  .diy-price {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent-orange);
    white-space: nowrap;
  }

  /* ===== UE MODEL ===== */
  .ue-panel {
    border-radius: 16px;
    border: 1px solid;
    padding: 2rem;
    margin-bottom: 1.5rem;
  }

  .ue-panel.red {
    background: rgba(255, 68, 68, 0.04);
    border-color: rgba(255, 68, 68, 0.2);
  }

  .ue-panel.green {
    background: rgba(0, 212, 170, 0.04);
    border-color: rgba(0, 212, 170, 0.2);
  }

  .ue-panel-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .ue-badge {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.3rem 0.8rem;
    border-radius: 100px;
  }

  .ue-badge.red { background: rgba(255,68,68,0.15); color: var(--accent-red); }
  .ue-badge.green { background: rgba(0,212,170,0.15); color: var(--accent-teal); }

  .ue-panel-title { font-size: 1.1rem; font-weight: 700; }

  .ue-metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }

  .ue-metric {
    text-align: center;
    padding: 1rem;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .ue-metric-val {
    font-size: 1.6rem;
    font-weight: 900;
    display: block;
    line-height: 1;
    margin-bottom: 0.3rem;
  }

  .ue-metric-val.red { color: var(--accent-red); }
  .ue-metric-val.green { color: var(--accent-teal); }
  .ue-metric-val.orange { color: var(--accent-orange); }

  .ue-metric-label {
    font-size: 0.72rem;
    color: var(--text-secondary);
  }

  .ue-arrow {
    text-align: center;
    padding: 1rem;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .ue-compare-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 1rem;
    align-items: center;
    margin-bottom: 1rem;
  }

  /* ===== COMPARISON TABLE ===== */
  .compare-header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border-radius: 12px 12px 0 0;
    overflow: hidden;
  }

  .compare-header div {
    padding: 0.9rem 1.2rem;
    font-weight: 700;
    font-size: 0.85rem;
    text-align: center;
  }

  .compare-header .dim { background: var(--bg-card); color: var(--text-secondary); }
  .compare-header .eb { background: rgba(255,68,68,0.08); color: var(--accent-red); }
  .compare-header .tx { background: rgba(0,212,170,0.08); color: var(--accent-teal); }

  /* ===== TIMELINE ===== */
  .timeline {
    position: relative;
    padding-left: 2.5rem;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: linear-gradient(180deg, var(--accent-orange), var(--accent-teal));
    border-radius: 2px;
  }

  .timeline-item {
    position: relative;
    margin-bottom: 1.8rem;
    padding-left: 1rem;
  }

  .timeline-item::before {
    content: '';
    position: absolute;
    left: -1.6rem;
    top: 0.4rem;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-orange);
    border: 2px solid var(--bg-primary);
    box-shadow: 0 0 0 2px var(--accent-orange);
  }

  .timeline-item:nth-child(3n+2)::before { background: var(--accent-teal); box-shadow: 0 0 0 2px var(--accent-teal); }
  .timeline-item:nth-child(3n+3)::before { background: var(--accent-purple); box-shadow: 0 0 0 2px var(--accent-purple); }

  .timeline-period {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-orange);
    margin-bottom: 0.2rem;
  }

  .timeline-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.3rem; }
  .timeline-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.6; }

  /* ===== FINANCE ===== */
  .finance-hero {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }

  .finance-big {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
  }

  .finance-big-num {
    font-size: 2.8rem;
    font-weight: 900;
    display: block;
    line-height: 1;
    margin: 0.5rem 0;
  }

  .finance-big-num.orange { color: var(--accent-orange); }
  .finance-big-num.teal { color: var(--accent-teal); }
  .finance-big-num.purple { color: var(--accent-purple); }

  .finance-big-label { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }
  .finance-big-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.4rem; }

  /* ===== RISK ===== */
  .risk-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1rem;
  }

  .risk-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.4rem 1.2rem;
    text-align: center;
  }

  .risk-icon { font-size: 1.8rem; margin-bottom: 0.6rem; display: block; }
  .risk-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.5rem; }
  .risk-response { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.6; }

  /* ===== PILOT STORE ===== */
  .pilot-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
  }

  .pilot-badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.3rem 0.8rem;
    border-radius: 100px;
    margin-bottom: 0.8rem;
  }

  .pilot-badge.primary { background: rgba(255,107,53,0.15); color: var(--accent-orange); }
  .pilot-badge.secondary { background: rgba(0,212,170,0.1); color: var(--accent-teal); }

  .pilot-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.4rem; }

  /* ===== CONCLUSION ===== */
  .action-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
    margin-top: 2.5rem;
  }

  .action-step {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .action-step::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
  }

  .action-step:nth-child(1)::before { background: var(--gradient-orange); }
  .action-step:nth-child(2)::before { background: var(--gradient-teal); }
  .action-step:nth-child(3)::before { background: var(--gradient-purple); }

  .action-step-num {
    font-size: 3rem;
    font-weight: 900;
    opacity: 0.1;
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .action-step-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
  .action-step-desc { font-size: 0.85rem; color: var(--text-secondary); }

  /* ===== FOOTER ===== */
  footer {
    border-top: 1px solid var(--border);
    padding: 2rem;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .footer-brand { color: var(--accent-orange); font-weight: 600; }
  .footer-confidential {
    display: inline-block;
    margin-top: 0.5rem;
    background: rgba(255,68,68,0.1);
    border: 1px solid rgba(255,68,68,0.2);
    color: var(--accent-red);
    padding: 0.2rem 0.8rem;
    border-radius: 100px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
  }

  /* ===== UE REASONS ===== */
  .ue-reasons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .ue-reason {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem 1rem;
    text-align: center;
  }

  .ue-reason-num {
    font-size: 2rem;
    font-weight: 900;
    color: var(--accent-teal);
    line-height: 1;
    margin-bottom: 0.4rem;
  }

  .ue-reason-title {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 0.2rem;
